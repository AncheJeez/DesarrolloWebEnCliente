<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    
    <div class="container mt-3 d-flex align-items-center gap-3 flex-wrap">
        <a href="./index.html" class="btn btn-primary">
            &larr; Volver
        </a>
        <div class="d-flex flex-column">
            <label for="modoConexion" class="form-label mb-1">Modo de conexión</label>
            <select id="modoConexion" class="form-select">
                <option value="local">LocalStorage</option>
                <option value="server">Servidor</option>
            </select>
        </div>
    </div>

    <div class="container my-5 d-flex justify-content-center">
        <div class="card shadow-lg p-4" style="max-width: 500px; width: 100%;">
            <div id="auth-content">

                <!-- Login Form -->
                <div id="login-card">
                    <h3 class="card-title text-center mb-4">Iniciar Sesión</h3>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginUser" class="form-label">Usuario</label>
                            <input type="text" class="form-control" id="loginUser" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="loginPassword" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Entrar</button>
                    </form>
                    <div class="mt-3 text-center">
                        ¿No tienes cuenta? <a href="#" id="showRegister">Regístrate</a>
                    </div>
                </div>

                <!-- Register Form -->
                <div id="register-card">
                    <h3 class="card-title text-center mb-4">Registro</h3>
                    <form id="registerForm">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="newUser" class="form-label">Usuario</label>
                                <input type="text" class="form-control" id="newUser" required>
                            </div>
                            <div class="col-md-6">
                                <label for="newEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="newEmail" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="newPhone" class="form-label">Teléfono</label>
                                <input type="text" class="form-control" id="newPhone" required>
                            </div>
                            <div class="col-md-6">
                                <label for="newBirthDate" class="form-label">Fecha de Nacimiento</label>
                                <input type="date" class="form-control" id="newBirthDate" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="newRole" class="form-label">Rol</label>
                                <select class="form-select" id="newRole" required>
                                    <option value="">Seleccione un rol</option>
                                    <option value="usuario">Usuario</option>
                                    <option value="administrador">Administrador</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="newFavoriteNumber" class="form-label">Número favorito</label>
                                <input type="number" class="form-control" id="newFavoriteNumber" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="newPassword" class="form-label">Contraseña</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="newPassword" required>
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                    Mostrar
                                </button>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="confirmPassword" required>
                                <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
                                    Mostrar
                                </button>
                            </div>
                        </div>
                        <div id="passwordStrength"></div>
                        <button type="submit" class="btn btn-primary w-100">Registrarse</button>
                    </form>
                    <div id="registerMessage" class="mt-2 text-center"></div>
                    <div class="mt-3 text-center">
                        ¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesión</a>
                    </div>
                </div>

                <div id="welcome-card" class="d-none text-center">
                    <h3 class="mb-3">¡Bienvenido <span id="userName"></span>!</h3>
                    <p id="mensaje">Se le está redirigiendo a la página principal...</p>
                </div>

            </div>
        </div>
    </div>

    <script src="../scripts/login_register.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
