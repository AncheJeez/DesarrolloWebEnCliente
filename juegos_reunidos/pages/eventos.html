<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/eventos.css">
    <title>Juego Eventos</title>
    <style>body {height: 100vh !important;}</style>
</head>
<body height="100vh">
    <div class="container mt-3">
        <a href="./index.html" class="btn btn-primary">
            &larr; Volver
        </a>
    </div>
    <!-- Contenido principal -->
    <div class="gameInfo">
        <label id="lblTime">Tiempo:  00:30</label>
        <label id="lblScore">Score: 0</label>
        <label id="lblPosition">Position mouse:</label>
        <div class="gameButtons">
            <button id="btnStart">Start</button>
        </div>
    </div>
    <div class="gameArea">
        <div class="canvas-wrapper">
            <canvas id="myCanvas"></canvas>
        </div>
        <div id="logs"></div>
    </div>
    <div id="instrucciones">
        <div class="hidden">
            Capturar bloque rojo -> 1 punto<br>
            Dar click al canvas -> entre 1-10 puntos<br>
            Dar doble click al canvas -> 20 puntos<br>
            Controles -> flechas del teclado y click del raton
        </div>
    </div>

    <footer class="bg-success text-white mt-auto py-4">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
            <!-- Texto del footer -->
            <span>© 2026 Juegos Reunidos. Todos los derechos reservados.</span>
            
            <!-- Enlaces -->
            <div>
                <a href="./contactanos.html" class="text-white me-3 text-decoration-none">Contáctanos</a>
                <a href="#" class="text-white me-3 text-decoration-none">Política de privacidad</a>
                <a href="#" class="text-white text-decoration-none">Términos y condiciones</a>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="../scripts/script_eventos.js" defer></script>
</body>
</html>
