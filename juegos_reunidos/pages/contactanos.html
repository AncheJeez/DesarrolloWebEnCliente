<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/form.css">
    <title>Cliente Principal</title>
</head>
<body>
    
    <div class="container mt-3">
        <a href="./index.html" class="btn btn-primary">
            &larr; Volver
        </a>
    </div>

    <!-- Contenido principal -->

    <div class="container my-5">
    <div class="card p-4 shadow-sm">
        <h2 class="mb-4">Contáctanos</h2>
        <form id="contactForm">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre:</label>
            <input type="text" id="nombre" class="form-control" name="name" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico:</label>
            <input type="email" id="email" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="asunto" class="form-label">Asunto:</label>
            <input type="text" id="asunto" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="mensaje" class="form-label">Mensaje:</label>
            <textarea id="mensaje" class="form-control" rows="5" required></textarea>
        </div>

        <button type="submit" class="btn btn-success w-100">Enviar formulario</button>
        </form>
    </div>
    </div>
    <!-- Footer -->
    <footer class="bg-success text-white mt-auto py-4">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
            <!-- Texto del footer -->
            <span>© 2026 Juegos Reunidos. Todos los derechos reservados.</span>
            
            <!-- Enlaces -->
            <div>
            <a href="./contactanos.html" class="text-white me-3 text-decoration-none">Contáctanos</a>
            <a href="#" class="text-white me-3 text-decoration-none">Política de privacidad</a>
            <a href="#" class="text-white text-decoration-none">Términos y condiciones</a>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../scripts/script_contactanos.js"></script>
</body>
</html>
