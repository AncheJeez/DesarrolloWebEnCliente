<!DOCTYPE html>
<meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1">
<html lang="es">
<head>
    <title>practicaTema2</title>
    <link rel="stylesheet" href="styles.css">
    <script type="text/javascript" src="sopaLetraJavaScript.js"></script>
</head>
<body>
    Introduzca las dimensiones de la sopa de letra: 
    <br>
    <input type="number" id="filas" value="10" required> x <input type="number" id="columnas" value="10" required>
    <br>
    Introduzca el número de palabras a insertar:
    <br>
    <input type="number" id="numPalabras" value="5" required>
    <br><br>
    <button type="submit" id="cargarTablero" onClick="cargarTablero()">Cargar tablero</button>
    <br><br>
    <!-- <table id="sopaLetras">
        <tr><td>No hay objetos en la tabla</td></tr>
    </table> -->
    <div class="hacerDesaparecer">

        Posicion Fila: <input type="number" id="pedirFila"><br>
        Posicion Columna: <input type="number" id="pedirFila"><br>
        Palabra a introducir: <input id="pedirPalabra"><br>
        <div>
            <input type="radio" id="horizontal" name="radioPosicion"><label for="radioOpt1">Horizontal</label><br>
            <input type="radio" id="verticalArriba" name="radioPosicion"><label for="radioOpt2">Vertical Arriba</label><br>
            <input type="radio" id="verticalAbajo" name="radioPosicion"><label for="radioOpt3">Vertical Abajo</label><br>
        </div>
        <button type="submit" onclick="introducirPalabra()">Añadir palabra</button>
        <button type="submit" onclick="empezarJuego()">Empezar juego</button>
    </div>
</body>
</html>
