<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Cliente Principal</title>
</head>
<body>
    <header>
        <div class="container-header">
            <h1>Juegos Reunidos</h1>
        </div>
        <div class="container-nav">
            <a href="">Principal</a>
            <a href="">Tienda</a>
            <div class="dropdown">
                <button class="dropbtn">
                    Juegos
                </button>
                <div class="dropdown-content">
                    <a href="#">Link 1</a>
                    <a href="#">Link 2</a>
                    <a href="#">Link 3</a>
                </div>
            </div>
            <a href="">Administración</a>
            <div id="profile-button" class="clickable">
                <img src="/imagenes/account_circle.svg" alt="Profile" />
            </div>
        </div>
    </header>
    <main>

        <div class="container-form" id="login-container">
            <p>Login</p>
            <form id="loginForm" action="" method="post">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" name="user_name"/>
                    
                    <label for="userPassword">Contraseña:</label>
                    <input type="password" id="userPassword" name="user_password"/>
                    <input type="submit" value="Logearse">
            </form>
            <div class="registro">
                Haga click <a href="#" id="show-register">aquí</a> para registrarse.
            </div>
        </div>

        <div class="container-form hidden" id="register-container">
            <p>Registro</p>
                <form id="registerForm">

                    <label for="newUser">Usuario:</label>
                    <input type="text" id="newUser" required>

                    <label for="newPassword">Contraseña:</label>
                    <input type="password" id="newPassword" required>

                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" required>

                    <label for="rol">Rol:</label>
                    <select id="rol" required>
                        <option value="">Seleccione un rol</option>
                        <option value="administrador">Administrador</option>
                        <option value="usuario">Usuario</option>
                    </select>

                    <label>Género:</label>
                    <div>
                        <label>
                            <input type="radio" name="genero" value="masculino" required>
                            Masculino
                        </label>
                        <label>
                            <input type="radio" name="genero" value="femenino">
                            Femenino
                        </label>
                        <label>
                            <input type="radio" name="genero" value="otros">
                            Otros
                        </label>
                    </div>

                    <input type="submit" value="Registrarse">
                </form>
                <div class="registro">
                    ¿Ya tienes cuenta? <a href="#" id="show-login">Volver al login</a>
                </div>
        </div>

        <div id="sidebar" class="sidebar">
            <div id="back-button" class="clickable">
                <img src="/imagenes/arrow_forward.svg" alt="Back" />
            </div>
            <button id="close-session-button">Cerrar sesión</button>
            <button id="borrar-datos-almacenados-button">Borrar todos los datos almacenados</button>
        </div>
    </main>
    <footer>
        Hey esto es el final de la página
        <a href="./pages/contactanos.html">Contáctanos</a>
    </footer>
</body>
<script type="text/javascript" src="./scripts/script_index.js" defer></script>
</html>
