<!DOCTYPE html>
<meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1">
<html lang="es">
<head>
    <title>Ejercicios 2.7</title>
</head>
    <body>
        <script>
            //1)
            let x = 5;
            let y = 10;
            if (x > y)
                console.log(x+" es mayor que "+y);
            else
                console.log(y+" es mayor que "+x);
            //2)
            let respuesta = ""
            for( let i = 0;i <=100; i++){
                if (i%5 == 0)
                    respuesta += i+",";
            }
            console.log("Multiplos de 5 del 0-100: "+respuesta)
            //3)
            let a = 1;
            while(a <= 10){
                if(a%2 == 0){
                    respuesta += a+",";
                }
                a++;
            }
            console.log("Multiplos de 3: "+respuesta)
            let b = 1;
            while(b <= 10){
                if(b%3 == 0){
                    respuesta += b+",";
                }
                b++;
            }
            console.log("Multiplos de 2: "+respuesta)
            //4)
            let numero1 = prompt("Por favor introduzca un numero","1")
            let numero2 = prompt("Por favor introduzca un segundo numero","2")
            let sum = parseFloat(numero1) + parseFloat(numero2)
            console.log("La suma de los numeros: "+numero1+"+"+numero2+" es igual a: "+ sum);

            //5)
            let givenAnio = prompt("Por favor introduzca un año","1999")
            if ((givenAnio%4 === 0 && givenAnio % 100 !== 0 ) || givenAnio % 400 === 0)
                console.log("El año dado "+givenAnio+" es bisiesto")
            console.log("El año dado "+givenAnio+" no es bisiesto")

            //6)
            let division = 80 / 4
            console.log("Resultado de 80/4: "+division)

            //7)
            let multiplicacion = 120 * 6
            console.log("Resultado de 120 * 6: "+multiplicacion)

            //8)

            /*
            Tenemos este ejemplo de bucle while:
            while(i<=100){
                i++;
            }
            
            Lo podemos convertir en un bucle for de esta forma:

            for(let i=0;i<=100;i++){
                console.log("Funciona correctamente el bucle")
            }
            */

            //9)

            let validacion = prompt("Quiere usted usar la primera calculadora? s/n","s")
            if(validacion == "s" || validacion == "S"){
                let primerNum = prompt("Deme un primer numero","3")
                let segundoNum = prompt("Deme un segundo numero","4")
                let cuenta = prompt("Introduzca el tipo de cuenta que quiere realizar: (+,-,*,/)","+")
                switch(cuenta){
                    case '+':
                        let suma = parseFloat(primerNum) + parseFloat(segundoNum)
                        window.alert("Respuesta de la suma: "+suma)
                        break;
                    case '-':
                        let resta = parseFloat(primerNum) - parseFloat(segundoNum)
                        window.alert("Respuesta de la resta: "+resta)
                        break;
                    case '*':
                        let multiplicacion = parseFloat(primerNum) * parseFloat(segundoNum)
                        window.alert("Respuesta de la multiplicacion: "+multiplicacion)
                        break;
                    case '/':
                        if(segundoNum === "0")
                            window.alert("No se puede dividir entre 0")
                        else{
                            let division = parseFloat(primerNum) / parseFloat(segundoNum)
                            window.alert("Respuesta de la division: "+division)
                        }
                        break;
                    default:
                        window.alert("Usted no ha introducido bien algún dato en la primera calculadora.")
                }
            }

            //10)
            let validacion2 = prompt("Quiere usted usar la segunda calculadora? s/n","s")
            let flag = true
            while(flag){
                if(validacion2 == "s" || validacion2 == "S"){
                let primerNum = prompt("Deme un primer numero","3")
                let segundoNum = prompt("Deme un segundo numero","4")
                let cuenta = prompt("Introduzca el tipo de cuenta que quiere realizar: (+,-,*,/) introduzca Salir to exit","+")
                switch(cuenta){
                    case '+':
                        let suma = parseFloat(primerNum) + parseFloat(segundoNum)
                        window.alert("Respuesta de la suma: "+suma)
                        break;
                    case '-':
                        let resta = parseFloat(primerNum) - parseFloat(segundoNum)
                        window.alert("Respuesta de la resta: "+resta)
                        break;
                    case '*':
                        let multiplicacion = parseFloat(primerNum) * parseFloat(segundoNum)
                        window.alert("Respuesta de la multiplicacion: "+multiplicacion)
                        break;
                    case '/':
                        if(segundoNum === "0")
                            window.alert("No se puede dividir entre 0")
                        else{
                            let division = parseFloat(primerNum) / parseFloat(segundoNum)
                            window.alert("Respuesta de la division: "+division)
                        }
                        break;
                    case 'Salir':
                        flag = false;
                    default:
                        if(flag)
                            window.alert("Usted no ha introducido bien algún dato en la primera calculadora.")
                }
            }
            }

        </script>
    </body>
</html>
